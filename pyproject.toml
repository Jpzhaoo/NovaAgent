[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-agent-workspace"
version = "0.1.0.dev0"
description = "Development workspace for the NovaAgent monorepo"
requires-python = ">=3.12"
dependencies = ["nova-core"]
license = { text = "Apache-2.0" }
readme = "README.md"

[dependency-groups]
dev = [
    "coverage==7.6.1",
    "mypy==1.14.1",
    "pytest==8.3.5",
    "ruff==0.9.10",
]

[tool.uv]
required-version = ">=0.12.9"

[tool.uv.sources]
nova-core = { workspace = true }
nova-graph = { workspace = true }
nova-react = { workspace = true }
nova-runtime = { workspace = true }

[tool.uv.workspace]
members = ["packages/nova-*"]

[tool.nova]
phase = 1
python-supported = ["3.12", "3.13"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nova_agent*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["nova_core"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
