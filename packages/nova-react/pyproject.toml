[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-react"
version = "0.1.0.dev0"
description = "Graph-driven ReAct strategy for NovaAgent"
requires-python = ">=3.12"
dependencies = ["nova-core==0.1.0.dev0", "nova-graph==0.1.0.dev0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nova_react*"]
