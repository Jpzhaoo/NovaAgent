[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-core"
version = "0.1.0.dev0"
description = "Stable NovaAgent contracts and typed ports"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[tool.setuptools.packages.find]
where = ["src"]

