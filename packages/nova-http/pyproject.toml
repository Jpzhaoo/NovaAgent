[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-http"
version = "0.1.0.dev0"
description = "ASGI and SSE adapter for NovaAgent"
requires-python = ">=3.12"
dependencies = ["nova-runtime==0.1.0.dev0"]

[tool.setuptools.packages.find]
where = ["src"]

