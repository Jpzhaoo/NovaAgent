name: quality

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  baseline:
    name: baseline (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv sync --locked
      - run: make check
      - run: uv run --frozen ruff check tools tests
      - run: uv run --frozen mypy --strict tools tests
      - run: uv run --frozen coverage run -m unittest discover -s tests
      - run: uv run --frozen coverage report --fail-under=0
